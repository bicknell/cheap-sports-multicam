[project]
name = "csm"
version = "0.1.0"
description = "Cheap sports multicam: sync and render tooling for the 4-camera 2x2 tiled rig"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
csm = "csm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["csm*"]
